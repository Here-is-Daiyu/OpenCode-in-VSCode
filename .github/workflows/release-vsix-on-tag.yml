name: Build and package VSIX

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "V*"

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Detect release tag
        id: tag_check
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "is_tag=true" >> "${GITHUB_OUTPUT}"
          else
            echo "is_tag=false" >> "${GITHUB_OUTPUT}"
            echo "No tag detected; skipping packaging steps."
          fi

      - name: Checkout repository
        if: steps.tag_check.outputs.is_tag == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.tag_check.outputs.is_tag == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install root dependencies
        if: steps.tag_check.outputs.is_tag == 'true'
        run: npm ci

      - name: Install webview dependencies
        if: steps.tag_check.outputs.is_tag == 'true'
        run: npm ci --prefix webview-ui

      - name: Parse version from tag
        if: steps.tag_check.outputs.is_tag == 'true'
        id: version
        shell: bash
        run: |
          raw_tag="${GITHUB_REF_NAME}"
          version="${raw_tag#v}"
          version="${version#V}"

          if [[ -z "${version}" || "${version}" == "${raw_tag}" ]]; then
            echo "::error::Tag '${raw_tag}' must start with v or V."
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Parsed version '${version}' is not a valid semver-like version."
            exit 1
          fi

          echo "raw_tag=${raw_tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Sync package.json version from tag
        if: steps.tag_check.outputs.is_tag == 'true'
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build extension
        if: steps.tag_check.outputs.is_tag == 'true'
        run: npm run build

      - name: Typecheck
        if: steps.tag_check.outputs.is_tag == 'true'
        run: npm run typecheck

      - name: Package VSIX
        if: steps.tag_check.outputs.is_tag == 'true'
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          existing_vsix=( *.vsix )
          if (( ${#existing_vsix[@]} > 0 )); then
            rm -f -- "${existing_vsix[@]}"
          fi

          npm run package

          packaged_vsix=( *.vsix )
          if (( ${#packaged_vsix[@]} != 1 )); then
            echo "::error::Expected exactly one VSIX file, found ${#packaged_vsix[@]}."
            printf 'Found files: %s\n' "${packaged_vsix[@]}"
            exit 1
          fi

          echo "vsix_path=${packaged_vsix[0]}" >> "${GITHUB_OUTPUT}"

      - name: Upload VSIX artifact
        if: steps.tag_check.outputs.is_tag == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: opencode-vscode-${{ steps.version.outputs.version }}-vsix
          path: ${{ steps.package.outputs.vsix_path }}
          if-no-files-found: error
