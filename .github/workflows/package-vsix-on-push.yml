name: Build dev VSIX on branch push

on:
  push:
    branches:
      - "**"

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm ci --prefix webview-ui

      - name: Derive dev version from commit SHA and date
        id: version
        shell: bash
        run: |
          build_date="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::7}"
          short_sha="${short_sha,,}"

          if [[ ! "${build_date}" =~ ^[0-9]{8}$ ]]; then
            echo "::error::Build date '${build_date}' is not a valid UTC date in YYYYMMDD format."
            exit 1
          fi

          if [[ ! "${short_sha}" =~ ^[0-9a-f]{7}$ ]]; then
            echo "::error::Short SHA '${short_sha}' is not a valid 7-character hex commit prefix."
            exit 1
          fi

          version="0.0.0-dev-${build_date}-${short_sha}"

          echo "build_date=${build_date}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Sync package.json version for dev package
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build extension
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Package VSIX
        id: package
        shell: bash
        run: |
          shopt -s nullglob
          existing_vsix=( *.vsix )
          if (( ${#existing_vsix[@]} > 0 )); then
            rm -f -- "${existing_vsix[@]}"
          fi

          npm run package

          packaged_vsix=( *.vsix )
          if (( ${#packaged_vsix[@]} != 1 )); then
            echo "::error::Expected exactly one VSIX file, found ${#packaged_vsix[@]}."
            printf 'Found files: %s\n' "${packaged_vsix[@]}"
            exit 1
          fi

          echo "vsix_path=${packaged_vsix[0]}" >> "${GITHUB_OUTPUT}"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-vscode-dev-${{ steps.version.outputs.build_date }}-${{ steps.version.outputs.short_sha }}-vsix
          path: ${{ steps.package.outputs.vsix_path }}
          if-no-files-found: error
          retention-days: 7
